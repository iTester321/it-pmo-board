<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IT PMO – Project Board</title>
<style>
/* ==========================================================
   1. DESIGN TOKENS (palette + spacing scale)
   ========================================================== */
:root {
  --blue-900: #0b2545;
  --blue-700: #13478c;
  --blue-600: #1a5cb8;
  --blue-100: #e3edfa;
  --blue-50:  #f2f6fc;
  --ink:      #1b2430;
  --ink-soft: #55627a;
  --line:     #d5deec;
  --surface:  #ffffff;
  --bg:       #eaf0f8;
  --red:      #c62828;
  --red-bg:   #fdeaea;
  --amber:    #d98200;
  --amber-bg: #fff3dc;
  --grey:     #8a94a6;
  --grey-bg:  #eceff4;
  --green:    #1b7a43;
  --green-bg: #e2f5ea;

  --sp-1: 4px;
  --sp-2: 8px;
  --sp-3: 12px;
  --sp-4: 16px;
  --sp-5: 24px;
  --sp-6: 32px;
  --radius: 8px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}

/* ==========================================================
   2. BASE
   ========================================================== */
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: var(--font);
  font-size: 14px;
  line-height: 1.4;
  color: var(--ink);
  background: var(--bg);
}
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid #f2a900; outline-offset: 2px; }
.visually-hidden {
  position: absolute; width: 1px; height: 1px; overflow: hidden;
  clip: rect(0 0 0 0); white-space: nowrap;
}

/* ==========================================================
   3. HEADER + SUMMARY STRIP
   ========================================================== */
.app-header {
  background: var(--blue-900);
  color: #fff;
  padding: var(--sp-3) var(--sp-5);
  display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-4);
}
.wordmark { display: flex; align-items: baseline; gap: var(--sp-2); margin: 0; }
.wordmark strong { font-size: 22px; letter-spacing: 1px; }
.wordmark span { font-size: 13px; opacity: 0.8; }
.summary { display: flex; flex-wrap: wrap; gap: var(--sp-2); margin: 0 auto 0 var(--sp-4); padding: 0; list-style: none; }
.summary li {
  background: rgba(255,255,255,0.12);
  border-radius: var(--radius);
  padding: var(--sp-1) var(--sp-3);
  font-size: 12px; text-align: center; min-width: 74px;
}
.summary b { display: block; font-size: 18px; }
.summary li.warn { background: var(--red); }
.btn {
  border: 1px solid var(--blue-600);
  background: var(--blue-600);
  color: #fff;
  border-radius: var(--radius);
  padding: var(--sp-2) var(--sp-4);
  cursor: pointer; font-weight: 600;
}
.btn:hover { background: var(--blue-700); }
.btn:disabled { opacity: 0.65; cursor: progress; }
.btn.secondary { background: var(--surface); color: var(--blue-700); }
.btn.secondary:hover { background: var(--blue-100); }
.app-header .btn { background: #fff; color: var(--blue-900); border-color: #fff; }
.app-header .btn:hover { background: var(--blue-100); }

/* ==========================================================
   4. FILTER BAR
   ========================================================== */
.filters {
  display: flex; flex-wrap: wrap; align-items: flex-end; gap: var(--sp-3);
  padding: var(--sp-3) var(--sp-5);
  background: var(--surface);
  border-bottom: 1px solid var(--line);
}
.filters label { display: block; font-size: 12px; color: var(--ink-soft); margin-bottom: var(--sp-1); }
.filters .note { margin-left: auto; font-size: 12px; color: var(--ink-soft); }

/* shared form-control look */
input[type="text"], input[type="date"], select, textarea {
  width: 100%;
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: var(--sp-2);
  background: #fff;
}
.filters input, .filters select { min-width: 170px; width: auto; }

/* ==========================================================
   5. BOARD + COLUMNS
   ========================================================== */
.board {
  display: flex; gap: var(--sp-4);
  padding: var(--sp-5);
  align-items: stretch;
}
.column {
  flex: 1 1 0; min-width: 0;
  background: var(--blue-50);
  border: 2px solid var(--line);
  border-radius: var(--radius);
  display: flex; flex-direction: column;
  min-height: 300px;
}
.column.drop-target { border-color: var(--blue-600); background: var(--blue-100); border-style: dashed; }
.column-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: var(--sp-3);
  border-bottom: 1px solid var(--line);
}
.column-header h2 { margin: 0; font-size: 15px; color: var(--blue-900); }
.count {
  background: var(--blue-700); color: #fff;
  border-radius: 999px; padding: 1px 10px; font-size: 12px; font-weight: 600;
}
.cards { padding: var(--sp-3); display: flex; flex-direction: column; gap: var(--sp-3); flex: 1; }
.empty { color: var(--ink-soft); font-size: 12px; text-align: center; padding: var(--sp-4); }

/* ==========================================================
   6. CARDS
   ========================================================== */
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-left: 6px solid var(--grey);
  border-radius: var(--radius);
  padding: var(--sp-3);
  box-shadow: 0 1px 2px rgba(11,37,69,0.08);
  cursor: grab;
}
.card.dragging { opacity: 0.4; }
.card.p-critical { border-left-color: var(--red); }
.card.p-high     { border-left-color: var(--amber); }
.card.p-medium   { border-left-color: var(--blue-600); }
.card.p-low      { border-left-color: var(--grey); }
.card-top { display: flex; justify-content: space-between; align-items: center; gap: var(--sp-2); }
.task-id { font-size: 11px; color: var(--ink-soft); font-family: ui-monospace, Menlo, Consolas, monospace; }
.card h3 { margin: var(--sp-1) 0; font-size: 14px; overflow-wrap: anywhere; }
.meta { font-size: 12px; color: var(--ink-soft); margin: 2px 0; overflow-wrap: anywhere; }
.row { display: flex; flex-wrap: wrap; gap: var(--sp-1); align-items: center; margin-top: var(--sp-2); }
.pill, .tag, .badge-overdue {
  display: inline-block; border-radius: 999px; padding: 1px 8px; font-size: 11px; font-weight: 600;
}
.pill.critical { background: var(--red-bg);   color: var(--red); }
.pill.high     { background: var(--amber-bg); color: #8a5400; }
.pill.medium   { background: var(--blue-100); color: var(--blue-700); }
.pill.low      { background: var(--grey-bg);  color: #4b5567; }
.tag { background: var(--green-bg); color: var(--green); }
.badge-overdue { background: var(--red-bg); color: var(--red); border: 1px solid var(--red); }
.icon-btn {
  border: none; background: transparent; cursor: pointer;
  font-size: 18px; line-height: 1; padding: 2px 6px; border-radius: 4px; color: var(--ink-soft);
}
.icon-btn:hover { background: var(--red-bg); color: var(--red); }
.small-btn {
  border: 1px solid var(--line); background: var(--surface); border-radius: 6px;
  padding: 2px 8px; font-size: 12px; cursor: pointer;
}
.small-btn:hover { background: var(--blue-100); }
.small-btn.danger { border-color: var(--red); color: var(--red); }
.confirm { background: var(--red-bg); border-radius: 6px; padding: var(--sp-2); margin-top: var(--sp-2); font-size: 12px; display: flex; gap: var(--sp-2); align-items: center; }

/* ==========================================================
   7. MODAL FORM
   ========================================================== */
dialog {
  border: none; border-radius: var(--radius); padding: 0;
  width: min(560px, 94vw); max-height: 94vh;
  box-shadow: 0 10px 40px rgba(0,0,0,0.35);
}
dialog::backdrop { background: rgba(11,37,69,0.55); }
.modal-head { background: var(--blue-900); color: #fff; padding: var(--sp-3) var(--sp-4); display: flex; justify-content: space-between; align-items: center; }
.modal-head h2 { margin: 0; font-size: 17px; }
.modal-head .icon-btn { color: #fff; }
.modal-head .icon-btn:hover { background: rgba(255,255,255,0.2); color: #fff; }
form.task-form { padding: var(--sp-4); display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-3); }
.field.full { grid-column: 1 / -1; }
.field label { display: block; font-weight: 600; margin-bottom: var(--sp-1); font-size: 13px; }
.field .req { color: var(--red); }
.field textarea { min-height: 80px; resize: vertical; }
.field.invalid input, .field.invalid select, .field.invalid textarea { border-color: var(--red); background: #fffafa; }
.error { color: var(--red); font-size: 12px; margin: var(--sp-1) 0 0; min-height: 0; }
.form-actions { grid-column: 1 / -1; display: flex; justify-content: flex-end; gap: var(--sp-2); }

/* ==========================================================
   8. TOASTS
   ========================================================== */
.toast-region {
  position: fixed; right: var(--sp-4); bottom: var(--sp-4);
  display: flex; flex-direction: column; gap: var(--sp-2); z-index: 1000; max-width: 360px;
}
.toast {
  background: var(--blue-900); color: #fff; padding: var(--sp-3) var(--sp-4);
  border-radius: var(--radius); box-shadow: 0 4px 14px rgba(0,0,0,0.3);
  border-left: 6px solid var(--green);
}
.toast.warn { border-left-color: var(--amber); }

/* ==========================================================
   9. RESPONSIVE: stack columns below 768px
   ========================================================== */
@media (max-width: 767px) {
  .board { flex-direction: column; padding: var(--sp-3); }
  .column { min-height: 0; }
  .summary { margin-left: 0; }
  .app-header, .filters { padding-left: var(--sp-3); padding-right: var(--sp-3); }
  form.task-form { grid-template-columns: 1fr; }
  .filters .note { margin-left: 0; }
}
</style>
</head>
<body>

<header class="app-header">
  <h1 class="wordmark"><strong>IT PMO</strong><span>Project Board · demo</span></h1>
  <ul class="summary" id="summary" aria-label="Board summary"></ul>
  <button type="button" class="btn" id="openForm">+ Add Task</button>
</header>

<section class="filters" aria-label="Filters">
  <div>
    <label for="fProject">Project</label>
    <select id="fProject"></select>
  </div>
  <div>
    <label for="fAssignee">Assignee contains</label>
    <input type="text" id="fAssignee" placeholder="e.g. Tan">
  </div>
  <div>
    <label for="fPriority">Priority</label>
    <select id="fPriority"></select>
  </div>
  <button type="button" class="btn secondary" id="clearFilters">Clear</button>
  <p class="note">Demo data lives in memory only – refreshing the page resets the board.</p>
</section>

<main>
  <section class="board" id="board" aria-label="Kanban board"></section>
</main>

<dialog id="taskDialog" aria-labelledby="dialogTitle">
  <div class="modal-head">
    <h2 id="dialogTitle">Add Task</h2>
    <button type="button" class="icon-btn" id="closeForm" aria-label="Close dialog">&times;</button>
  </div>
  <form class="task-form" id="taskForm" novalidate>
    <div class="field full">
      <label for="title">Task Title <span class="req">*</span></label>
      <input type="text" id="title" name="title" maxlength="80" aria-describedby="err-title">
      <p class="error" id="err-title"></p>
    </div>
    <div class="field full">
      <label for="description">Description</label>
      <textarea id="description" name="description" maxlength="500" aria-describedby="err-description"></textarea>
      <p class="error" id="err-description"></p>
    </div>
    <div class="field">
      <label for="project">Project / Workstream</label>
      <select id="project" name="project"></select>
    </div>
    <div class="field">
      <label for="category">Category</label>
      <select id="category" name="category"></select>
    </div>
    <div class="field">
      <label for="assignee">Assignee <span class="req">*</span></label>
      <input type="text" id="assignee" name="assignee" aria-describedby="err-assignee">
      <p class="error" id="err-assignee"></p>
    </div>
    <div class="field">
      <label for="priority">Priority</label>
      <select id="priority" name="priority"></select>
    </div>
    <div class="field">
      <label for="dueDate">Due Date <span class="req">*</span></label>
      <input type="date" id="dueDate" name="dueDate" aria-describedby="err-dueDate">
      <p class="error" id="err-dueDate"></p>
    </div>
    <div class="field">
      <label for="status">Status</label>
      <select id="status" name="status"></select>
    </div>
    <div class="form-actions">
      <button type="button" class="btn secondary" id="cancelForm">Cancel</button>
      <button type="submit" class="btn" id="submitBtn">Add Task</button>
    </div>
  </form>
</dialog>

<div class="toast-region" id="toasts" aria-live="polite"></div>

<script>
/* ==========================================================
   CONFIG
   ----------------------------------------------------------
   NOTE: FormSubmit requires a one-time activation. The first
   submission sent to this address triggers a confirmation
   email; submissions are only delivered once the link in that
   email has been clicked. Swap the address in ONE place below.
   ========================================================== */
const FORMSUBMIT_ENDPOINT = "https://formsubmit.co/ajax/YOUR_EMAIL@example.com";
const TASK_ID_PREFIX = "UOB-ITPM-";

/* ==========================================================
   REFERENCE DATA
   ========================================================== */
const STATUSES   = ["Backlog", "In Progress", "Blocked", "Done"];
const PROJECTS   = ["Core Banking Upgrade", "Digital Channels", "Cybersecurity Uplift", "Data & Analytics", "Infrastructure & Cloud", "Vendor Management"];
const CATEGORIES = ["Application Development", "Infrastructure", "Cybersecurity", "Data", "Compliance", "Vendor"];
const PRIORITIES = ["Critical", "High", "Medium", "Low"];

/* ==========================================================
   STATE (single source of truth, memory only – no storage APIs)
   ========================================================== */
const state = {
  tasks: [],
  filters: { project: "", assignee: "", priority: "" },
  ui: { confirmDeleteId: null, moveOpenId: null, dragId: null, focusKey: null }
};
let nextTaskNumber = 1;

/* ==========================================================
   HELPERS
   ========================================================== */
const $ = (id) => document.getElementById(id);

// Escape every user-supplied string before it touches innerHTML.
function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>"']/g, (ch) => (
    { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]
  ));
}

// Local-time YYYY-MM-DD, offset by N days from today.
function isoDate(offsetDays = 0) {
  const d = new Date();
  d.setDate(d.getDate() + offsetDays);
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${d.getFullYear()}-${m}-${day}`;
}

function isOverdue(task) {
  return task.status !== "Done" && task.dueDate < isoDate(0);
}

function nextTaskId() {
  return TASK_ID_PREFIX + String(nextTaskNumber++).padStart(4, "0");
}

function formatDate(iso) {
  const [y, m, d] = iso.split("-").map(Number);
  return new Date(y, m - 1, d).toLocaleDateString(undefined, { day: "2-digit", month: "short", year: "numeric" });
}

function optionsHtml(list, selected) {
  return list.map((v) => `<option value="${escapeHtml(v)}"${v === selected ? " selected" : ""}>${escapeHtml(v)}</option>`).join("");
}

/* ==========================================================
   SEED DATA
   ========================================================== */
function seedTasks() {
  const seed = [
    ["Migrate FX pricing service to AWS", "Lift-and-shift of the FX pricing microservice with latency benchmarks.", "Infrastructure & Cloud", "Infrastructure", "Priya Nair", "High", 21, "Backlog"],
    ["Patch CVE-2025-XXXX on branch teller VDI", "Roll out vendor patch to branch teller virtual desktops in waves.", "Cybersecurity Uplift", "Cybersecurity", "Daniel Tan", "Critical", -2, "In Progress"],
    ["UAT sign-off for mobile onboarding release 4.2", "Collect business sign-off for the digital onboarding flow.", "Digital Channels", "Application Development", "Mei Lin Chua", "High", 5, "In Progress"],
    ["Core ledger interface regression suite", "Extend automated regression for the general ledger interface.", "Core Banking Upgrade", "Application Development", "Arjun Mehta", "Medium", 14, "Backlog"],
    ["Data lineage mapping for regulatory reports", "Document lineage for liquidity and capital reports.", "Data & Analytics", "Compliance", "Sarah Lim", "Medium", -5, "Blocked"],
    ["Vendor SLA renewal – card processing", "Awaiting vendor legal markup on the revised SLA.", "Vendor Management", "Vendor", "Kenneth Ong", "Low", 30, "Blocked"],
    ["Decommission legacy reporting server", "Archive data and power down end-of-life reporting hosts.", "Infrastructure & Cloud", "Infrastructure", "Rahul Verma", "Low", -10, "Done"],
    ["Penetration test remediation – internet banking", "Close out all high findings from the latest pen test.", "Cybersecurity Uplift", "Cybersecurity", "Wei Jie Koh", "Critical", -1, "Done"]
  ];
  return seed.map(([title, description, project, category, assignee, priority, due, status]) => ({
    id: nextTaskId(), title, description, project, category, assignee, priority, dueDate: isoDate(due), status
  }));
}

/* ==========================================================
   FILTERING
   ========================================================== */
function applyFilters(tasks) {
  const { project, assignee, priority } = state.filters;
  const needle = assignee.trim().toLowerCase();
  return tasks.filter((t) =>
    (!project || t.project === project) &&
    (!priority || t.priority === priority) &&
    (!needle || t.assignee.toLowerCase().includes(needle))
  );
}

/* ==========================================================
   RENDERING (the only place card/column DOM is built)
   ========================================================== */
function renderCard(task) {
  const confirming = state.ui.confirmDeleteId === task.id;
  const moving = state.ui.moveOpenId === task.id;
  const pKey = task.priority.toLowerCase();
  const id = escapeHtml(task.id);

  const moveTargets = STATUSES.filter((s) => s !== task.status).map((s) =>
    `<button type="button" class="small-btn" data-action="move-to" data-id="${id}" data-status="${escapeHtml(s)}">${escapeHtml(s)}</button>`
  ).join("");

  return `
  <article class="card p-${pKey}" draggable="true" data-id="${id}" aria-label="${escapeHtml(task.id + ": " + task.title)}">
    <div class="card-top">
      <span class="task-id">${id}</span>
      <button type="button" class="icon-btn" data-action="delete-ask" data-id="${id}" data-focus="del-${id}" aria-label="Delete task ${id}">&times;</button>
    </div>
    <h3>${escapeHtml(task.title)}</h3>
    <p class="meta">📁 ${escapeHtml(task.project)}</p>
    <p class="meta">👤 ${escapeHtml(task.assignee)} · 📅 ${escapeHtml(formatDate(task.dueDate))}</p>
    <div class="row">
      <span class="pill ${pKey}">${escapeHtml(task.priority)}</span>
      <span class="tag">${escapeHtml(task.category)}</span>
      ${isOverdue(task) ? '<span class="badge-overdue">Overdue</span>' : ""}
    </div>
    <div class="row">
      <button type="button" class="small-btn" data-action="move-toggle" data-id="${id}" data-focus="mv-${id}" aria-expanded="${moving}">Move ▸</button>
      ${moving ? moveTargets : ""}
    </div>
    ${confirming ? `
    <div class="confirm" role="group" aria-label="Confirm delete">
      <span>Delete?</span>
      <button type="button" class="small-btn danger" data-action="delete-yes" data-id="${id}">Yes</button>
      <button type="button" class="small-btn" data-action="delete-no" data-id="${id}" data-focus="no-${id}">No</button>
    </div>` : ""}
  </article>`;
}

function renderSummary() {
  const all = state.tasks;
  const items = [`<li><b>${all.length}</b>Total</li>`];
  STATUSES.forEach((s) => items.push(`<li><b>${all.filter((t) => t.status === s).length}</b>${escapeHtml(s)}</li>`));
  const od = all.filter(isOverdue).length;
  items.push(`<li class="${od ? "warn" : ""}"><b>${od}</b>Overdue</li>`);
  $("summary").innerHTML = items.join("");
}

function renderBoard() {
  const visible = applyFilters(state.tasks);
  $("board").innerHTML = STATUSES.map((status) => {
    const cards = visible.filter((t) => t.status === status);
    return `
    <section class="column" data-status="${escapeHtml(status)}" aria-label="${escapeHtml(status)} column">
      <div class="column-header">
        <h2>${escapeHtml(status)}</h2>
        <span class="count" aria-label="${cards.length} tasks">${cards.length}</span>
      </div>
      <div class="cards">${cards.length ? cards.map(renderCard).join("") : '<p class="empty">No tasks</p>'}</div>
    </section>`;
  }).join("");
  renderSummary();

  // Restore keyboard focus after a re-render.
  if (state.ui.focusKey) {
    const el = document.querySelector(`[data-focus="${state.ui.focusKey}"]`);
    if (el) el.focus();
    state.ui.focusKey = null;
  }
}

/* ==========================================================
   ACTIONS (mutate state, then re-render)
   ========================================================== */
function addTask(data) {
  const task = { id: nextTaskId(), ...data };
  state.tasks.push(task);
  renderBoard();
  return task;
}

function moveTask(id, newStatus) {
  const task = state.tasks.find((t) => t.id === id);
  if (!task || !STATUSES.includes(newStatus) || task.status === newStatus) return;
  task.status = newStatus;
  state.ui.moveOpenId = null;
  state.ui.focusKey = `mv-${id}`;
  renderBoard();
}

function deleteTask(id) {
  state.tasks = state.tasks.filter((t) => t.id !== id);
  state.ui.confirmDeleteId = null;
  renderBoard();
}

function showToast(message, kind = "ok", ms = 4500) {
  const el = document.createElement("div");
  el.className = "toast" + (kind === "warn" ? " warn" : "");
  el.textContent = message; // textContent: safe by construction
  $("toasts").appendChild(el);
  setTimeout(() => el.remove(), ms);
}

/* ==========================================================
   FORMSUBMIT INTEGRATION
   ========================================================== */
async function notifyNewTask(task) {
  const res = await fetch(FORMSUBMIT_ENDPOINT, {
    method: "POST",
    headers: { "Content-Type": "application/json", Accept: "application/json" },
    body: JSON.stringify({
      _subject: `[UOB IT PMO] New task ${task.id}: ${task.title}`,
      _template: "table",
      _captcha: "false",
      "Task ID": task.id,
      Title: task.title,
      Description: task.description,
      Project: task.project,
      Category: task.category,
      Assignee: task.assignee,
      Priority: task.priority,
      "Due Date": task.dueDate,
      Status: task.status,
      "Submitted At": new Date().toISOString()
    })
  });
  if (!res.ok) throw new Error(`FormSubmit failed: ${res.status}`);
  return res.json();
}

/* ==========================================================
   FORM: validation + submit
   ========================================================== */
const form = $("taskForm");

function setError(field, message) {
  $("err-" + field).textContent = message;
  $(field).closest(".field").classList.toggle("invalid", Boolean(message));
  $(field).setAttribute("aria-invalid", message ? "true" : "false");
}

function readForm() {
  const v = (id) => $(id).value.trim();
  return {
    title: v("title"), description: v("description"), project: $("project").value,
    category: $("category").value, assignee: v("assignee"), priority: $("priority").value,
    dueDate: $("dueDate").value, status: $("status").value
  };
}

function validateForm(d) {
  const errors = {};
  if (!d.title) errors.title = "Task title is required.";
  else if (d.title.length > 80) errors.title = "Title must be 80 characters or fewer.";
  if (d.description.length > 500) errors.description = "Description must be 500 characters or fewer.";
  if (!d.assignee) errors.assignee = "Assignee is required.";
  if (!d.dueDate) errors.dueDate = "Due date is required.";
  else if (d.dueDate < isoDate(0)) errors.dueDate = "Due date cannot be in the past.";
  ["title", "description", "assignee", "dueDate"].forEach((f) => setError(f, errors[f] || ""));
  return errors;
}

async function handleSubmit(event) {
  event.preventDefault();
  const data = readForm();
  const errors = validateForm(data);
  const firstBad = Object.keys(errors)[0];
  if (firstBad) { $(firstBad).focus(); return; }

  const btn = $("submitBtn");
  btn.disabled = true;
  btn.textContent = "Sending…";

  // Optimistic UI: card appears immediately.
  const task = addTask(data);
  resetForm();
  closeDialog();
  showToast(`Task ${task.id} added to the board.`);

  // Notification runs in parallel; failure never breaks the board.
  try {
    await notifyNewTask(task);
  } catch (err) {
    showToast("Card added locally — email notification failed", "warn", 6500);
  } finally {
    btn.disabled = false;
    btn.textContent = "Add Task";
  }
}

function resetForm() {
  form.reset();
  $("priority").value = "Medium";
  $("status").value = "Backlog";
  ["title", "description", "assignee", "dueDate"].forEach((f) => setError(f, ""));
}

function openDialog() {
  $("dueDate").min = isoDate(0);
  $("taskDialog").showModal();
  $("title").focus();
}
function closeDialog() { $("taskDialog").close(); $("openForm").focus(); }

/* ==========================================================
   EVENT WIRING
   ========================================================== */
function initControls() {
  $("project").innerHTML = optionsHtml(PROJECTS);
  $("category").innerHTML = optionsHtml(CATEGORIES);
  $("priority").innerHTML = optionsHtml(PRIORITIES, "Medium");
  $("status").innerHTML = optionsHtml(STATUSES, "Backlog");
  $("fProject").innerHTML = `<option value="">All projects</option>` + optionsHtml(PROJECTS);
  $("fPriority").innerHTML = `<option value="">All priorities</option>` + optionsHtml(PRIORITIES);

  $("fProject").addEventListener("change", (e) => { state.filters.project = e.target.value; renderBoard(); });
  $("fPriority").addEventListener("change", (e) => { state.filters.priority = e.target.value; renderBoard(); });
  $("fAssignee").addEventListener("input", (e) => { state.filters.assignee = e.target.value; renderBoard(); });
  $("clearFilters").addEventListener("click", () => {
    state.filters = { project: "", assignee: "", priority: "" };
    $("fProject").value = ""; $("fPriority").value = ""; $("fAssignee").value = "";
    renderBoard();
  });

  $("openForm").addEventListener("click", openDialog);
  $("closeForm").addEventListener("click", closeDialog);
  $("cancelForm").addEventListener("click", closeDialog);
  form.addEventListener("submit", handleSubmit);

  // Card buttons: event delegation on the board.
  $("board").addEventListener("click", (e) => {
    const btn = e.target.closest("[data-action]");
    if (!btn) return;
    const id = btn.dataset.id;
    switch (btn.dataset.action) {
      case "move-toggle":
        state.ui.moveOpenId = state.ui.moveOpenId === id ? null : id;
        state.ui.focusKey = `mv-${id}`;
        renderBoard(); break;
      case "move-to": moveTask(id, btn.dataset.status); break;
      case "delete-ask":
        state.ui.confirmDeleteId = id; state.ui.focusKey = `no-${id}`;
        renderBoard(); break;
      case "delete-no":
        state.ui.confirmDeleteId = null; state.ui.focusKey = `del-${id}`;
        renderBoard(); break;
      case "delete-yes": deleteTask(id); break;
    }
  });

  // Native HTML5 drag and drop.
  const board = $("board");
  board.addEventListener("dragstart", (e) => {
    const card = e.target.closest(".card");
    if (!card) return;
    state.ui.dragId = card.dataset.id;
    e.dataTransfer.effectAllowed = "move";
    e.dataTransfer.setData("text/plain", card.dataset.id);
    card.classList.add("dragging");
  });
  board.addEventListener("dragend", () => {
    state.ui.dragId = null;
    renderBoard();
  });
  board.addEventListener("dragover", (e) => {
    const col = e.target.closest(".column");
    if (!col || !state.ui.dragId) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = "move";
    board.querySelectorAll(".drop-target").forEach((c) => { if (c !== col) c.classList.remove("drop-target"); });
    col.classList.add("drop-target");
  });
  board.addEventListener("dragleave", (e) => {
    const col = e.target.closest(".column");
    if (col && !col.contains(e.relatedTarget)) col.classList.remove("drop-target");
  });
  board.addEventListener("drop", (e) => {
    const col = e.target.closest(".column");
    if (!col) return;
    e.preventDefault();
    const id = e.dataTransfer.getData("text/plain") || state.ui.dragId;
    state.ui.dragId = null;
    moveTask(id, col.dataset.status);
    renderBoard();
  });
}

/* ==========================================================
   INIT
   ========================================================== */
state.tasks = seedTasks();
initControls();
renderBoard();
</script>
</body>
</html>
